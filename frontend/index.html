<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТендерТрак - Авторизация и Регистрация</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: #666; }
        .tab.active { color: #007bff; border-bottom: 3px solid #007bff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0056b3; }
        .hidden { display: none; }
        .alert { padding: 10px; margin-top: 15px; border-radius: 6px; font-size: 14px; text-align: center; }
        .alert-error { background: #f8d7da; color: #721c24; }
        .alert-success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>

<div class="container">
    <h2>ТендерТрак</h2>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('register')">Регистрация</div>
        <div class="tab" onclick="switchTab('login')">Вход</div>
    </div>

    <!-- Форма регистрации -->
    <form id="registerForm">
        <div class="form-group">
            <label for="role">Роль в системе</label>
            <select id="role" required>
                <option value="zakazchik">Заказчик / Грузовладелец</option>
                <option value="perevozchik">Перевозчик / Экспедитор</option>
            </select>
        </div>
        <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="example@company.com" required>
        </div>
        <div class="form-group">
            <label for="regPhone">Телефон</label>
            <input type="tel" id="regPhone" placeholder="+996XXXXXXXXX" required>
        </div>
        <div class="form-group">
            <label for="regInn">ИНН компании / ИП</label>
            <input type="text" id="regInn" placeholder="Введите ИНН" required>
        </div>
        <div class="form-group">
            <label for="regPassword">Пароль</label>
            <input type="password" id="regPassword" required>
        </div>
        <button type="submit">Зарегистрироваться</button>
    </form>

    <!-- Форма входа -->
    <form id="loginForm" class="hidden">
        <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="example@company.com" required>
        </div>
        <div class="form-group">
            <label for="loginPassword">Пароль</label>
            <input type="password" id="loginPassword" required>
        </div>
        <button type="submit">Войти</button>
    </form>

    <div id="alertMessage" class="alert hidden"></div>
</div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if (tab === 'register') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }
        hideAlert();
    }

    function showAlert(msg, isSuccess = false) {
        const alert = document.getElementById('alertMessage');
        alert.textContent = msg;
        alert.className = `alert ${isSuccess ? 'alert-success' : 'alert-error'}`;
        alert.classList.remove('hidden');
    }

    function hideAlert() {
        document.getElementById('alertMessage').classList.add('hidden');
    }

    // Обработка регистрации
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const payload = {
            role: document.getElementById('role').value,
            email: document.getElementById('regEmail').value,
            phone: document.getElementById('regPhone').value,
            inn: document.getElementById('regInn').value,
            password: document.getElementById('regPassword').value
        };

        try {
            const res = await fetch('/api/v1/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (res.ok) {
                showAlert('Регистрация прошла успешно! Теперь вы можете войти.', true);
                setTimeout(() => switchTab('login'), 1500);
            } else {
                showAlert(data.detail || 'Ошибка при регистрации');
            }
        } catch (err) {
            showAlert('Не удалось связаться с сервером');
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();
        try {
            const res = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('loginEmail').value,
                    password: document.getElementById('loginPassword').value
                })
            });
            const data = await res.json();
            if (!res.ok) {
                showAlert(data.detail || 'Ошибка входа');
                return;
            }
            localStorage.setItem('tendertruck_access_token', data.access_token);
            window.location.href = '/tenders.html';
        } catch (err) {
            showAlert('Не удалось связаться с сервером');
        }
    });
</script>
</body>
</html>
